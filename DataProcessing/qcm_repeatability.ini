; ---------------------------------------------------------------
; QCM repeatability analysis - configuration
; Run:  python qcm_repeatability.py qcm_repeatability.ini
; (needs qcm_analysis.py in the same folder)
; Paths are relative to this config file.
; ---------------------------------------------------------------

[input]
; One log per run, one per line (indent the continuation lines).
; The order here = run order (used for the trend and the plot).
log_files =
    ../logs/tm13_alllog_20261117_repeatability_run1.csv
    ../logs/tm13_alllog_20261117_repeatability_run2.csv
    ../logs/tm13_alllog_20261117_repeatability_run3.csv

[analysis]
rate_column = Rate60pt_Hz_s
invert_rate = true
; Which per-run number goes into the repeatability statistics:
;   mean   = mean of the rate column in the window
;   median = median of the rate column
;   slope  = linear fit of frequency vs time (independent of the rate filter)
metric = slope
; Empty = all channels found in the logs
channels =
; Optional: also evaluate the ratio of two channels per run, e.g. 1,2 -> ch1/ch2
; (shows whether variation is common to both sensors, i.e. source variation)
ratio_channels = 1,2
; A run window with fewer samples than this is ignored
min_samples = 50

[output]
results_file = plots/repeatability.txt
csv_file = plots/repeatability_runs.csv
save_plot = true
plot_file = plots/repeatability.png
show_plot = true

; ---------------------------------------------------------------
; Steps to compare between runs. Every section starting with "step"
; is evaluated.
;
; mode = label:
;   label        label text (case-insensitive, exact)
;   occurrence   which occurrence of the label in each log:
;                  longest (default) | first | last | all (pooled) | 1,2,3...
;                A single value applies to all runs, or give one per run
;                separated by commas, e.g.  occurrence = longest, 2, longest
;   trim_start_s / trim_end_s   cut transients from the window edges
;
; mode = interval:
;   intervals    one "t0-t1" (seconds) per run, separated by ";",
;                or a single one for all runs
;                e.g.  intervals = 328-482 ; 1975-2187 ; 157-216
; ---------------------------------------------------------------

[step_cu50]
mode = label
label = Cu50w
occurrence = longest
trim_start_s = 20
trim_end_s = 5

[step_cu100]
mode = label
label = Cu100w
occurrence = longest
trim_start_s = 20
trim_end_s = 5
