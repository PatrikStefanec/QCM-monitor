[input]
log_file = ../logs/tm13_alllog_20261117_repeatability_run3.csv
; log_file = ../logs/tm13_alllog_20261117_repeatability_run2.csv
; log_file = ../logs/tm13_alllog_20261117_repeatability_run1.csv

[output]
results_file = plots/steady_rates.txt
save_plot = true
plot_file = plots/qcm_plot.png
show_plot = true

[plot]
; Rate column used for plotting and for steady rates
rate_column = Rate60pt_Hz_s
; relative = frequency minus first value of each channel (sensors are easy to compare)
; absolute = raw frequency in Hz
frequency_mode = relative
; Flip sign of rate so deposition shows as positive (frequency drops when material is added)
invert_rate = true
; Highlight label regions
show_labels = true
; Draw the steady-rate evaluation windows on the rate plot
show_steady_windows = true
; Leave empty = all channels, otherwise e.g. 1,2
channels =

; ---------------------------------------------------------------
; Steady rate definitions.
; Every section whose name starts with "steady" is evaluated.
; Add as many as you need (steady_cu, steady_ti, steady_3 ...).
;
; mode = label     -> uses the time span of the given label
;        interval  -> uses t_start .. t_end (seconds, Time_s of the log)
;
; trim_start_s / trim_end_s: cut transient away from label region
;                            (only used in label mode)
; occurrence: for label mode, if the label appears several times:
;             all (pooled, default) or a number 1,2,3...
; channels: optional, empty = all channels
; ---------------------------------------------------------------

[steady_1]
mode = label
label = Cu50w
trim_start_s = 20
trim_end_s = 5
occurrence = all
channels =
[steady_2]
mode = label
label = Cu100w
trim_start_s = 20
trim_end_s = 5
occurrence = all
channels =
; [steady_2]
; mode = interval
; t_start = 300
; t_end = 400
; channels =